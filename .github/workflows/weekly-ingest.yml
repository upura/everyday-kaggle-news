# Weekly Kaggle News の号を LLM が ingest し、号ごとに PR を作成するワークフロー
# 反映はこの PR を編集者がレビュー・マージすることで行う(GEMINI.md の運用サイクル参照)
#
# 号ごとに独立したブランチ(auto/wkn-<号番号>)を使う。固定ブランチを使うと、
# 前週の PR が未マージのまま翌週の実行にリセット・上書きされ、取り込みが消える
name: Weekly ingest

on:
  schedule:
    # 土曜 09:00 JST(金曜配信の翌朝)
    - cron: "0 0 * * 6"
  workflow_dispatch:
    inputs:
      issue_url:
        description: "取り込む号の URL(省略時は未取り込みの号を自動で検出する)"
        required: false
        default: ""
      force:
        description: "log.md に記録済みの号でも取り込む"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: weekly-ingest
  cancel-in-progress: false

jobs:
  # log.md に記録が無い号を洗い出す。取りこぼした号も後から拾えるようにする
  detect:
    runs-on: ubuntu-latest
    outputs:
      issues: ${{ steps.detect.outputs.issues }}
    steps:
      - uses: actions/checkout@v4

      - name: Install HTTP client dependencies
        run: python3 -m pip install -q --break-system-packages curl_cffi || true

      - name: Detect un-ingested issues
        id: detect
        env:
          ISSUE_URL: ${{ inputs.issue_url }}
          FORCE: ${{ inputs.force }}
        run: python3 tools/detect_uningested_issues.py

  ingest:
    needs: detect
    if: needs.detect.outputs.issues != '[]'
    runs-on: ubuntu-latest
    strategy:
      # 1 号でも失敗した場合に残りを巻き添えにしない
      fail-fast: false
      # 取りこぼし分をまとめて処理するとき、PR を 1 本ずつ順に作る
      max-parallel: 1
      matrix:
        issue: ${{ fromJSON(needs.detect.outputs.issues) }}
    steps:
      - uses: actions/checkout@v4

      - name: Pre-fetch issue content and external links
        env:
          TARGET_ISSUE_NUM: ${{ matrix.issue.number }}
          TARGET_ISSUE_URL: ${{ matrix.issue.url }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep || true
          python3 -m pip install -q --break-system-packages curl_cffi || true
          python3 - <<'PY'
          import glob, html, os, re, sys
          sys.path.insert(0, "tools")
          import detect_uningested_issues as dui

          issue_num = os.environ["TARGET_ISSUE_NUM"]
          issue_url = os.environ["TARGET_ISSUE_URL"]
          issue_html = dui.fetch_issue_content(issue_url)

          for fname in (f".wkn-issue-{issue_num}.html", f"wkn-issue-{issue_num}.html"):
              with open(fname, "w", encoding="utf-8") as f:
                  f.write(issue_html)

          md_files = sorted(glob.glob("docs/**/*.md", recursive=True))
          links = []
          seen = set()
          for m in re.finditer(r'<a\s+[^>]*href="([^"]+)"[^>]*>(.*?)</a>', issue_html, re.S):
              u = html.unescape(m.group(1).strip())
              t = html.unescape(re.sub(r"<[^>]+>", "", m.group(2)).strip())
              if not u.startswith("http") or u in seen or u.rstrip("/") == issue_url.rstrip("/"):
                  continue
              seen.add(u)
              norm = re.sub(r"^https?://", "", u.rstrip("/"))
              hits = []
              for p in md_files:
                  with open(p, encoding="utf-8") as mf:
                      for lineno, line in enumerate(mf, 1):
                          if norm in line:
                              hits.append(f"{p}:{lineno}")
              links.append((t, u, hits))

          def summarize_url(url):
              for candidate in (url, f"https://r.jina.ai/{url}"):
                  try:
                      raw = dui._http_get_text(candidate)
                      if not raw or len(raw.strip()) < 80:
                          continue
                      if candidate.startswith("https://r.jina.ai/"):
                          return re.sub(r"\s+", " ", raw).strip()[:800]
                      title_m = re.search(r"<title[^>]*>(.*?)</title>", raw, re.I | re.S)
                      title_s = html.unescape(re.sub(r"<[^>]+>", "", title_m.group(1)).strip()) if title_m else ""
                      desc_m = re.search(
                          r'<meta[^>]+(?:name|property)=["\'](?:og:description|description)["\'][^>]+content=["\']([^"\']+)["\']',
                          raw, re.I
                      ) or re.search(
                          r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+(?:name|property)=["\'](?:og:description|description)["\']',
                          raw, re.I
                      )
                      desc_s = html.unescape(desc_m.group(1).strip()) if desc_m else ""
                      body = re.sub(r"<(script|style|noscript)[^>]*>.*?</\1>", " ", raw, flags=re.I | re.S)
                      body = html.unescape(re.sub(r"<[^>]+>", " ", body))
                      body = re.sub(r"\s+", " ", body).strip()[:600]
                      parts = [p for p in (f"Title: {title_s}" if title_s else "", f"Description: {desc_s}" if desc_s else "", f"Excerpt: {body}" if body else "") if p]
                      if parts:
                          return " / ".join(parts)
                  except Exception:
                      pass
              return "(事前取得不可 — 号本文の説明文を参照)"

          out = [
              f"# Weekly Kaggle News #{issue_num} 事前取得・解析データ",
              f"- 号 URL: {issue_url}",
              "",
              "## 1. 号の本文 (HTML)",
              "```html",
              issue_html.strip(),
              "```",
              "",
              "## 2. 号内のリンク一覧・docs/ 既掲載チェック・各リンクの概要",
          ]
          for idx, (t, u, hits) in enumerate(links, 1):
              if hits:
                  out.append(f"### {idx}. [{t}]({u})")
                  out.append(f"- 状態: **既掲載** ({', '.join(hits)})")
              else:
                  out.append(f"### {idx}. [{t}]({u})")
                  out.append("- 状態: **未掲載**")
                  out.append(f"- 事前取得概要: {summarize_url(u)}")

          with open(f"wkn-issue-{issue_num}.md", "w", encoding="utf-8") as f:
              f.write("\n".join(out) + "\n")
          print(f"Pre-fetched wkn-issue-{issue_num}.md ({len(links)} links)")
          PY

      - name: Run Gemini CLI
        id: gemini
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: "gemini-3.8-flash"
          gemini_debug: "true"
          prompt: |
            .gemini/skills/ingest/SKILL.md の手順に従い、Weekly Kaggle News の号を取り込んでください。

            - 対象の号: ${{ matrix.issue.url }} (Weekly Kaggle News #${{ matrix.issue.number }})
            - カレントディレクトリの `wkn-issue-${{ matrix.issue.number }}.md` に、号の本文 HTML・抽出された全リンク・`docs/` 内の既掲載チェック結果（該当ファイルと行番号）・未掲載リンクの事前取得概要がすべてまとめられています。最初に必ず `read_file` で `wkn-issue-${{ matrix.issue.number }}.md` を読んでください（既に情報が揃っているため、原則として `web_fetch` や重複確認の `grep_search` を繰り返す必要はありません）
            - `grep_search` を使う場合は `dir_path` にファイル名ではなくディレクトリ（`docs` など）を指定すること
            - この号だけを取り込むこと。ほかの号には手を出さないこと
            - ルートの GEMINI.md の規約(エントリ形式・タクソノミー・権利面)に従うこと
            - docs/ 配下のファイルを直接編集し、必ず `docs/wiki/log.md` の先頭（5 行目）に号単位で記録すること
            - `docs/wiki/log.md` の記録行は必ず `- YYYY-MM-DD ingest: WKN #${{ matrix.issue.number }} → 新規 M 件（...）` の形式で始めること（この行頭形式が次回以降の取り込み済み判定と直後の検証ステップに使われるため、URL や別表記にしないこと）
            - 編集後に `python3 tools/verify_wiki.py` を実行してリンク切れや形式エラーがないことを確認すること
            - git のコミットや push は行わないこと(後段のステップが PR を作成する)
            - 最後に、追加したエントリと変更したページの一覧を出力すること

      - name: Clean up stray files outside the wiki scope
        run: git clean -fd -- . ':!docs' ':!README.md'

      # log.md への記録が無いと次回の実行が同じ号をもう一度拾ってしまうため、
      # 静かに通さず失敗させる
      - name: Verify the issue was recorded in log.md
        env:
          TARGET_ISSUE_NUM: ${{ matrix.issue.number }}
          TARGET_ISSUE_URL: ${{ matrix.issue.url }}
        run: |
          echo "=== git status ==="
          git status -s
          python3 - <<'PY'
          import os, re
          num = os.environ["TARGET_ISSUE_NUM"]
          url = os.environ["TARGET_ISSUE_URL"].rstrip("/")
          path = "docs/wiki/log.md"
          with open(path, encoding="utf-8") as f:
              text = f.read()
          pattern = re.compile(rf"^- (\d{{4}}-\d{{2}}-\d{{2}}) ingest: WKN #{num}\b", re.M)
          if not pattern.search(text):
              alt = re.compile(
                  rf"^- (\d{{4}}-\d{{2}}-\d{{2}}) ingest:\s*(?:{re.escape(url)}/?|Weekly Kaggle News #{num}|#{num})\s*→",
                  re.M,
              )
              new_text, count = alt.subn(rf"- \1 ingest: WKN #{num} →", text, count=1)
              if count > 0:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(new_text)
                  print(f"Normalized log.md entry prefix to 'WKN #{num}'")
          PY
          echo "=== git diff docs/wiki/log.md ==="
          git diff docs/wiki/log.md || true
          if ! grep -qE "^- [0-9]{4}-[0-9]{2}-[0-9]{2} ingest: WKN #${{ matrix.issue.number }}\b" docs/wiki/log.md; then
            echo "::error::docs/wiki/log.md に WKN #${{ matrix.issue.number }} の記録がありません"
            exit 1
          fi

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Ingest Weekly Kaggle News #${{ matrix.issue.number }}"
          title: "Weekly ingest: Weekly Kaggle News #${{ matrix.issue.number }}"
          body: |
            [Weekly Kaggle News #${{ matrix.issue.number }}](<${{ matrix.issue.url }}>) の自動 ingest です。
            以下を確認してからマージしてください。

            - `docs/wiki/log.md` の号単位の記録
            - 追加エントリの分類・注釈・形式(GEMINI.md の規約準拠)

            取りこぼし分をまとめて取り込んだ場合は、この PR のほかにも号ごとの PR が開いています。
            いずれも `main` を基点にしているため、**号番号の小さいものから順にマージ**してください。
            後続の PR は `log.md` と README の「最近の更新」で衝突することがあります。

            🤖 Generated with [Gemini CLI](https://github.com/google-gemini/gemini-cli)
          branch: auto/wkn-${{ matrix.issue.number }}
          delete-branch: true
          add-paths: |
            docs/**
            README.md
          # docs/ と README.md 以外の差分(取得失敗時の一時ファイルなど)は PR に含めない

      # 差分ゼロで PR が作られないまま success になると取りこぼしに気づけない
      - name: Fail if no pull request was produced
        run: |
          if [ -z "${{ steps.cpr.outputs.pull-request-number }}" ]; then
            echo "::error::WKN #${{ matrix.issue.number }} の取り込みで差分が生じず、PR が作成されませんでした"
            exit 1
          fi
          echo "PR #${{ steps.cpr.outputs.pull-request-number }} (${{ steps.cpr.outputs.pull-request-operation }}): ${{ steps.cpr.outputs.pull-request-url }}" >> "$GITHUB_STEP_SUMMARY"
