# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # 毎日 06:00 JST に最新のコンペ開催情報(docs/calendar.md 用)で再ビルドする
  schedule:
    - cron: "0 21 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
# contents: write は更新した docs/competitions.json を main に書き戻すために必要
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build search index and concept map data
        run: |
          python3 tools/build_search_index.py
          python3 tools/build_graph_data.py
      # コンペ開催カレンダー用のデータを取得(要シークレット KAGGLE_API_TOKEN。
      # 失敗時はコミット済みの docs/competitions.json をそのまま使う)
      - name: Fetch latest competitions data
        continue-on-error: true
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python3 tools/fetch_competitions.py docs/competitions.json
      # 終了直後のコンペは Kaggle API から消えるため、取得結果を main に書き戻して
      # 次回ビルドの引き継ぎ元にする(GITHUB_TOKEN による push はワークフローを再起動しない)
      - name: Commit refreshed competitions data
        continue-on-error: true
        run: |
          git show HEAD:docs/competitions.json > /tmp/prev-competitions.json 2>/dev/null || echo '{}' > /tmp/prev-competitions.json
          if python3 -c "import json,sys; a=json.load(open('/tmp/prev-competitions.json')).get('competitions'); b=json.load(open('docs/competitions.json')).get('competitions'); sys.exit(0 if a == b else 1)"; then
            echo "コンペ一覧に変化なし。コミットをスキップします"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/competitions.json
          git commit -m "Update competitions data"
          git push origin HEAD:main
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
